# Runs the tests, uploads each run to S3, and publishes the Qaily report in two ways, so they can be compared:
#
#   WEBSITE approach  https://qaily.github.io/qaily-playwright-ts-framework/
#                     Dashboard data is deployed with the site after every run. Only screenshots, traces and other
#                     attachments come from S3. Dashboards need no key; attachments do.
#
#   BUCKET approach   https://qaily.github.io/qaily-playwright-ts-framework/bucket/
#                     The site holds only the report app and data/settings.json. Everything else (dashboard data
#                     and attachments) is published to S3 and read from there with signed links, so new data shows
#                     without redeploying the site. Every viewer needs a key.
#
# Steps marked [BOTH] serve both approaches, [WEBSITE] or [BUCKET] only one.
#
# Without S3 settings (see README → "Connect S3") only the website copy is built: it shows the latest run, with its
# attachments published on the site.
#
# Run it by hand with "Deploy the site" unticked to update the data without redeploying GitHub Pages: the bucket copy
# then shows the new run, the website copy keeps the old data.
name: Tests and report

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1-5' # weekdays, so the dashboards have history
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the site to GitHub Pages (untick to update only the bucket data)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_REGION: ${{ vars.S3_REGION }}
  S3_PREFIX: ${{ vars.S3_PREFIX }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_DATA_PREFIX: ${{ vars.S3_DATA_PREFIX }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # [BOTH] Raw run folder (JSONL + attachments) to S3. The .sync-complete marker goes last: the report skips run
      # folders without it, so a half-uploaded run never shows up. Pull requests don't upload (forks have no access
      # to the secrets).
      - name: '[BOTH] Upload the run to S3'
        if: always() && env.S3_BUCKET != '' && github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required # needed for Google Cloud Storage, harmless elsewhere
        run: |
          prefix="${S3_PREFIX:-qaily-playwright-ts-framework/jsonl-report}"
          args=(--region "${S3_REGION:-eu-north-1}" --only-show-errors)
          if [ -n "$S3_ENDPOINT" ]; then args+=(--endpoint-url "$S3_ENDPOINT"); fi
          for dir in reports/data/*/; do
            run=$(basename "$dir")
            aws s3 sync "$dir" "s3://$S3_BUCKET/$prefix/$run" "${args[@]}"
            echo '{"complete":true}' | aws s3 cp - "s3://$S3_BUCKET/$prefix/$run/.sync-complete" "${args[@]}"
            echo "Uploaded $run"
          done

      # [WEBSITE, no bucket] The report job builds from this when there is no bucket.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run
          path: reports/data
          retention-days: 14

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      # Scheduled and push runs always deploy; a manual run deploys unless "Deploy the site" is unticked.
      DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: '[BOTH] Report settings: lanes, and the bucket from repository variables'
        run: node scripts/report-settings.mjs report-data website

      # [BUCKET] What was published last time, so the build below only rebuilds months that changed.
      - name: '[BUCKET] Pull the published report data'
        if: env.S3_BUCKET != ''
        run: npx qaily-report pull --out report-data

      # [BOTH] Every run folder from the bucket (without attachments), then the dashboard data (rollups).
      - name: '[BOTH] Build from the bucket (all runs)'
        if: env.S3_BUCKET != ''
        run: npx qaily-report sync --to runs --out report-data

      - name: '[WEBSITE, no bucket] Get this run'
        if: env.S3_BUCKET == ''
        uses: actions/download-artifact@v4
        with:
          name: run
          path: runs

      - name: '[WEBSITE, no bucket] Build from this run'
        if: env.S3_BUCKET == ''
        run: npx qaily-report build --in runs --out report-data

      - name: '[BOTH] Planned coverage matrix for the heat map'
        run: npx qaily-report catalog --csv coverage/matrix.csv --out report-data/coverage-catalog.json

      # [BUCKET] Dashboard data to S3, catalog.json last. From here on the bucket copy shows the new run,
      # whether or not the site is deployed below.
      - name: '[BUCKET] Publish the report data to S3'
        if: env.S3_BUCKET != ''
        run: npx qaily-report publish --out report-data

      - name: '[BOTH] Assemble the site'
        if: env.DEPLOY == 'true'
        run: |
          # [WEBSITE] copy at the site root: the report app plus all dashboard data.
          cp -r node_modules/@qaily/playwright-html-reporter/app site
          cp -r report-data site/data
          if [ -z "$S3_BUCKET" ]; then
            # No bucket: screenshots and traces are published with the site.
            for dir in runs/*/; do
              run=$(basename "$dir")
              if [ -d "$dir/attachments" ]; then mkdir -p "site/data/runs/$run" && cp -r "$dir/attachments" "site/data/runs/$run/"; fi
            done
          else
            # [BUCKET] copy under /bucket/: the report app and settings.json only; it reads everything else from S3.
            cp -r node_modules/@qaily/playwright-html-reporter/app site/bucket
            node scripts/report-settings.mjs site/bucket/data bucket
          fi

      - name: '[BOTH] Deploy to GitHub Pages'
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v5
      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: env.DEPLOY == 'true'
        uses: actions/deploy-pages@v4

      - name: Skipped the site deploy
        if: env.DEPLOY != 'true'
        run: echo "Not deployed. The bucket copy (/bucket/) shows the new data; the website copy keeps what it had."
